<!doctype html>

     SPDX-License-Identifier: MIT -->
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Гэрийн наран цаг · Sol</title>
  <link rel="stylesheet" href="style.css?v=0.3">
  <script defer src="engine.js?v=0.3"></script>
  <script defer src="app.js?v=0.3"></script>
  <!-- Aggregate, cookie-free visits; see /sol/docs/ANALYTICS.md. -->
  <script>
    if (location.hostname === "gantemur.github.io") {
      const tracker = document.createElement("script");
      tracker.async = true;
      tracker.src = "https://gc.zgo.at/count.js";
      tracker.setAttribute("data-goatcounter", "https://gantemur-sol.goatcounter.com/count");
      tracker.setAttribute("data-goatcounter-settings", JSON.stringify({"path":"/sol/toono/","title":"Гэрийн наран цаг","no_events":true}));
      document.head.appendChild(tracker);
    }
  </script>
</head>
<body>
<main>
  <header>
    <a href="../">← Sol</a>
    <div class="seg" role="group" aria-label="Хэл / Language">
      <button type="button" data-lang="mn" aria-pressed="true">MN</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <h1><span data-i="title">Гэрийн наран цаг</span> <span id="version" class="badge">alpha</span></h1>

  <div class="layout">
    <section class="stage">
      <div class="hero" aria-live="polite">
        <div><span id="heroAnimal" class="hero-animal">—</span> <span data-i="hourWord">цаг</span></div>
        <div id="heroLine" class="hero-line"></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="ger" role="img" data-i-label="canvasLabel" aria-label="Гэрийн дотор тусах нарны гэрэл"></canvas>
      </div>

      <div class="controls">
        <div class="row">
          <button type="button" id="play" class="round" aria-pressed="false" data-i-label="play" aria-label="Явуулах">▶</button>
          <label class="slider"><span><span data-i="time">Цаг</span> <output id="timeOut"></output></span>
            <input id="timeSlider" type="range" min="0" max="1439" step="1"></label>
        </div>
        <div class="row">
          <button type="button" id="now" class="quiet small" data-i="now">Одоо</button>
          <label class="slider"><span><span data-i="date">Өдөр</span> <output id="dateOut"></output></span>
            <input id="dateSlider" type="range" min="1" max="365" step="1" list="seasonMarks"></label>
        </div>
        <datalist id="seasonMarks"><option value="79"></option><option value="172"></option><option value="266"></option><option value="355"></option></datalist>
        <div class="row wrap">
          <div class="seg" role="group" data-i-label="viewLabel" aria-label="Харах">
            <button type="button" data-view="plan" aria-pressed="true" data-i="viewPlan">Дээрээс</button>
            <button type="button" data-view="toono" aria-pressed="false" data-i="viewToono">Тоононоос</button>
          </div>
          <label class="inline"><span data-i="speed">Хурд</span>
            <select id="speed">
              <option value="-3600" data-i="spdM3600">−1 цаг/сек</option>
              <option value="1" data-i="spd1">Бодит</option>
              <option value="60" data-i="spd60">1 мин/сек</option>
              <option value="600" data-i="spd600" selected>10 мин/сек</option>
              <option value="3600" data-i="spd3600">1 цаг/сек</option>
            </select>
          </label>
        </div>
        <p id="viewNote" class="note"></p>
        <div id="legend" class="legend"></div>
      </div>
    </section>

    <section class="side">
      <table class="hours">
        <caption data-i="readings">Арван хоёр цаг — дөрвөн уншлага</caption>
        <tbody id="hours"></tbody>
      </table>
      <p id="sunLine" class="note"></p>

      <details>
        <summary data-i="placeTitle">Газар</summary>
        <div class="grid">
          <label><span data-i="preset">Газар</span><select id="preset"></select></label>
          <label><span data-i="zone">Цагийн бүс</span><select id="zone"></select></label>
          <label><span data-i="lat">Өргөрөг</span><input id="lat" type="number" min="-89" max="89" step="0.01"></label>
          <label><span data-i="lon">Уртраг</span><input id="lon" type="number" min="-180" max="180" step="0.01"></label>
        </div>
        <p><button type="button" id="geo" class="quiet small" data-i="useLocation">Миний байршил</button> <span id="geoStatus" class="note"></span></p>
      </details>

      <details>
        <summary data-i="overlays">Нэмэлт шугам</summary>
        <label class="check"><input type="checkbox" id="ovUni" checked><span data-i="ovUni">Унь</span></label>
        <label class="check"><input type="checkbox" id="ovLabels" checked><span data-i="ovLabels">Гэрийн хэсгийн нэр</span></label>
        <label class="check"><input type="checkbox" id="ovWedges" checked><span data-i="ovWedges">Гэрийн 12 тогтмол зүг</span></label>
        <label class="check"><input type="checkbox" id="ovSectors"><span data-i="ovSectors">Энэ өдрийн :40 хуваарь (гэрт)</span></label>
        <label class="check"><input type="checkbox" id="ovPath"><span data-i="ovPath">Энэ өдрийн гэрлийн зам</span></label>
        <label class="check"><input type="checkbox" id="ovSeasons"><span data-i="ovSeasons">Туйл, тэгшитгэлийн өдрүүдийн замнал</span></label>
        <label class="check"><input type="checkbox" id="ovTemporal"><span data-i="ovTemporal">Нар мандахаас эхэлсэн тэгш бус цаг</span></label>
        <label class="field"><span data-i="ovSundial">Нарны цагийн шугам (шалан дээр)</span>
          <select id="ovSundial">
            <option value="off" data-i="sdOff">Үгүй</option>
            <option value="solar" data-i="sdSolar">Жинхэнэ нарны цаг</option>
            <option value="clock40" data-i="sdClock">:40 хуваарь (дундаж)</option>
          </select>
        </label>
      </details>

      <details>
        <summary data-i="gerTitle">Гэр</summary>
        <div class="grid">
          <label><span data-i="size">Хэмжээ</span>
            <select id="size">
              <option value="4" data-i="size4">4 ханатай</option>
              <option value="5" data-i="size5" selected>5 ханатай</option>
              <option value="6" data-i="size6">6 ханатай</option>
            </select>
          </label>
          <label><span data-i="urkh">Өрх</span>
            <select id="urkh">
              <option value="full" data-i="urkhOpen">Нээлттэй</option>
              <option value="half" data-i="urkhHalf">Хагас нээлттэй</option>
            </select>
          </label>
          <label><span data-i="door">Хаалганы чиг (°)</span><input id="door" type="number" min="0" max="359" step="1" value="180"></label>
          <label><span data-i="uniCount">Униын тоо</span><input id="uniCount" type="number" min="12" max="200" step="1"></label>
          <label><span data-i="diam">Шалны диаметр (м)</span><input id="diam" type="number" min="1.5" max="20" step="0.05"></label>
          <label><span data-i="wallH">Ханын өндөр (м)</span><input id="wallH" type="number" min="0.4" max="4" step="0.05"></label>
          <label><span data-i="toonoH">Тооны өндөр (м)</span><input id="toonoH" type="number" min="0.6" max="8" step="0.05"></label>
          <label><span data-i="toonoD">Тооны диаметр (м)</span><input id="toonoD" type="number" min="0.2" max="4" step="0.05"></label>
        </div>
        <p class="note" data-i="gerNote">Хэмжээнүүд ойролцоо.</p>
      </details>

      <details class="help">
        <summary data-i="helpTitle">Тайлбар</summary>
        <div id="helpBody"></div>
      </details>
      <p id="error" role="alert"></p>
    </section>
  </div>
</main>
</body>
</html>
